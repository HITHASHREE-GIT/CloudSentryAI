services:
  - type: web
    name: cloudsentry-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: cloudsentry/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
    autoDeploy: true