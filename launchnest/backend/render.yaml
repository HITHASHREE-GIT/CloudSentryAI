services:
  - type: web
    name: launchnest-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: launchnest/backend
    buildCommand: pip install -r requirements.txt && python -m app.utils.seed --force
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
    autoDeploy: true